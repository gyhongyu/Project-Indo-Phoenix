<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Indo-Phoenix — Mission Control Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=JetBrains+Mono:wght@200;300&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/template-b.css">
</head>
<body data-template="b">

<div class="preloader"><div class="preloader__num">0</div></div>
<canvas id="bg-canvas"></canvas>
<div class="grain"></div>
<div class="scanlines"></div>

<nav class="nav">
  <a class="brand" href="#">INDO<em>·</em>PHOENIX</a>
  <div class="nav-right">
    <div class="nav-links">
      <a href="#mission" data-i18n="nav.mission"></a>
      <a href="#metrics" data-i18n="nav.metrics"></a>
      <a href="presentation.html?theme=b" class="nav-deck-link" data-i18n="nav.deck"></a>
      <a href="presentation.html?theme=b#13" class="nav-deck-link" data-i18n="nav.contact"></a>
    </div>
    <button class="lang-toggle">中文</button>
  </div>
</nav>

<!-- ================= HERO ================= -->
<header class="hero">
  <p class="label hero-kicker" data-reveal data-delay="100" data-i18n="hero.kicker"></p>
  <h1 class="hero-title" data-reveal data-delay="250">
    <span data-i18n="hero.titleA">Project</span><em data-i18n="hero.titleB">Indo-Phoenix</em>
  </h1>
  <p class="hero-sub" data-reveal data-delay="420" data-i18n="hero.sub"></p>
  <div class="hero-cta" data-reveal data-delay="560">
    <a class="btn-line nav-deck-link" href="presentation.html?theme=b#13" data-i18n="cta.btn"></a>
  </div>
  <div class="hud-status hud-card" data-reveal data-delay="720">
    <span class="hud-dot"></span>
    <span>FEASIBILITY&nbsp;MODEL&nbsp;·&nbsp;<b>VERIFIED</b>&nbsp;·&nbsp;CAP&nbsp;<b><span data-stat="capacityMonthlyM2" data-count="15000">15,000</span>&nbsp;m²/MO</b>&nbsp;·&nbsp;EBIT&nbsp;<b><span data-stat="ebitMargin" data-decimals="1" data-count="21.7">21.7</span>%</b>&nbsp;·&nbsp;IRR&nbsp;<b><span data-stat="irrLow" data-decimals="1" data-count="21.3">21.3</span>–<span data-stat="irrHigh" data-decimals="1" data-count="24.8">24.8</span>%</b></span>
  </div>
  <div class="scroll-hint"><span data-i18n="hero.scroll"></span><i></i></div>
</header>

<!-- ================= MISSION ================= -->
<section class="section" id="mission">
  <span class="label" data-reveal data-i18n="mission.label"></span>
  <h2 class="section-title" data-reveal data-i18n="mission.title"></h2>
  <div class="mission-grid">
    <article class="hud-card" data-reveal>
      <h3 data-i18n="mission.m1t"></h3>
      <p data-i18n="mission.m1d"></p>
    </article>
    <article class="hud-card" data-reveal>
      <h3 data-i18n="mission.m2t"></h3>
      <p data-i18n="mission.m2d"></p>
    </article>
    <article class="hud-card" data-reveal>
      <h3 data-i18n="mission.m3t"></h3>
      <p data-i18n="mission.m3d"></p>
    </article>
  </div>
</section>

<!-- ================= METRICS ================= -->
<section class="section" id="metrics">
  <span class="label" data-reveal data-i18n="metrics.label"></span>
  <h2 class="section-title" data-reveal data-i18n="metrics.title"></h2>
  <div class="tile-grid">
    <div class="tile hud-card" data-reveal><span class="tile-num"><span data-stat="ebitMargin" data-decimals="1" data-count="21.7">0</span>%</span><h4 data-i18n="tiles.ebit.label"></h4><p data-i18n="tiles.ebit.desc"></p></div>
    <div class="tile hud-card" data-reveal><span class="tile-num"><span data-stat="bep" data-decimals="1" data-count="55.7">0</span>%</span><h4 data-i18n="tiles.bep.label"></h4><p data-i18n="tiles.bep.desc"></p></div>
    <div class="tile hud-card" data-reveal><span class="tile-num"><span data-stat="irrLow" data-decimals="1" data-count="21.3">21.3</span><span class="tilde">–</span><span data-stat="irrHigh" data-decimals="1" data-count="24.8">24.8</span>%</span><h4 data-i18n="tiles.irr.label"></h4><p data-i18n="tiles.irr.desc"></p></div>
    <div class="tile hud-card" data-reveal><span class="tile-num"><span data-stat="payback" data-decimals="1" data-count="4.2">0</span> yrs</span><h4 data-i18n="tiles.payback.label"></h4><p data-i18n="tiles.payback.desc"></p></div>
    <div class="tile hud-card" data-reveal><span class="tile-num">$<span data-stat="totalCapex" data-scale="1000000" data-count="23">0</span>M</span><h4 data-i18n="tiles.capex.label"></h4><p data-i18n="tiles.capex.desc"></p></div>
    <div class="tile hud-card" data-reveal><span class="tile-num">$<span data-stat="annualRevenue" data-scale="1000000" data-decimals="1" data-count="25.2">0</span>M</span><h4 data-i18n="tiles.rev.label"></h4><p data-i18n="tiles.rev.desc"></p></div>
  </div>
</section>

<!-- ================= FOOTER ================= -->
<footer class="footer" id="contact">
  <hr class="footer-rule" data-reveal>
  <div class="cta-block">
    <p class="cta-body" data-reveal data-i18n="cta.body"></p>
    <a class="btn-line nav-deck-link" href="presentation.html?theme=b#13" data-reveal data-i18n="cta.btn"></a>
  </div>
  <div class="footer-bottom">
    <span data-i18n="foot.note"></span>
    <span data-i18n="foot.rights"></span>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/content-engine.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/scene-b.js"></script>
<script src="assets/js/fx-core.js"></script>
<script src="assets/js/fx-b.js"></script>
<script>
document.addEventListener("ipx:ready", function () {
  if (!window.gsap || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  gsap.registerPlugin(ScrollTrigger);
  gsap.to(".hero > *", {
    yPercent: -12, opacity: 0.2, ease: "none", stagger: 0.02,
    scrollTrigger: { trigger: ".hero", start: "top top", end: "bottom top", scrub: true }
  });
});
</script>
</body>
</html>
