<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Indo-Phoenix — Executive Investor Presentation (WebPPT)</title>
  
  <!-- Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,300&family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Jost:wght@200;300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/presentation.css">
</head>
<body data-template="a">
  <canvas id="bg-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>
  <div class="grain"></div>

  <!-- Top Control Bar -->
  <header class="deck-topbar">
    <div class="brand-group">
      <a class="brand-title" href="index.html">INDO<em>·</em>PHOENIX</a>
      <a class="btn-exit-landing" id="btnExitLanding" href="template-a.html">✕ <span data-i18n="exitLanding">Landing Page</span></a>
    </div>

    <div class="deck-controls">
      <!-- Quick Jump to Slide 00 Agenda Hub -->
      <button class="btn-agenda-quick" onclick="jumpToSlide(0)" title="Jump to Executive Agenda">
        <span>☰</span>
        <span data-i18n="navAgenda">AGENDA</span>
      </button>

      <!-- Bilingual Language Toggle (Preserves active theme) -->
      <div class="control-group">
        <button class="btn-ctrl active" id="btn-lang-en" onclick="setLang('en')">EN</button>
        <button class="btn-ctrl" id="btn-lang-zh" onclick="setLang('zh')">繁中</button>
      </div>
    </div>
  </header>

  <!-- Presentation Stage Area -->
  <main class="deck-stage">
    <div class="slide-wrapper" id="slideWrapper">
      <div class="scan-beam" id="scanBeam"></div>
      
      <!-- Dynamic Slide Content -->
      <div id="slideContent"></div>
    </div>
  </main>

  <!-- Executive Detail Modal Container -->
  <div class="deck-modal-backdrop" id="deckModal" onclick="closeDetailModal(event)">
    <div class="deck-modal-card" onclick="event.stopPropagation()">
      <button class="modal-close-btn" onclick="closeDetailModal()">✕</button>
      <div class="modal-tag" id="modalTag">EXECUTIVE NOTE / 決策指標依據</div>
      <div class="modal-title" id="modalTitle">Financial Indicator</div>
      <div class="modal-stat-badge">
        <span class="val" id="modalVal">$0</span>
        <span class="lbl" id="modalLbl">BENCHMARK</span>
      </div>
      <div class="modal-body-text" id="modalText">
        Strategic Explanation text from Google Sheet FPC Factory Model.
      </div>
      <div class="modal-source-ref">
        <span>●</span>
        <span id="modalSource">FPC Factory Model SSOT</span>
      </div>
    </div>
  </div>

  <!-- High-Res Sample Image Lightbox Modal -->
  <div class="image-modal-backdrop" id="imageModal" onclick="closeImageModal(event)">
    <div class="image-modal-card" onclick="event.stopPropagation()">
      <button class="modal-close-btn" onclick="closeImageModal()">✕</button>
      <img id="imageModalImg" class="image-modal-img" src="" alt="High Res Sample" />
      <div id="imageModalCaption" class="image-modal-caption">SAMPLE PREVIEW</div>
    </div>
  </div>

  <!-- Deck Navigation Footer -->
  <footer class="deck-footer">
    <div class="timeline-steps" id="timelineSteps"></div>
    <div class="nav-actions">
      <button class="btn-nav" onclick="prevSlide()" data-i18n="btnPrev">◄ PREV</button>
      <button class="btn-nav" onclick="nextSlide()" data-i18n="btnNext">NEXT ►</button>
    </div>
  </footer>

  <!-- Core Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/content-engine.js"></script>
  <script src="assets/js/app.js"></script>

  <!-- Modular Presentation Engine & SSOT Deck Data -->
  <script src="assets/js/presentation-data.js"></script>
  <script src="assets/js/presentation-engine.js"></script>
</body>
</html>
