<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Indo-Phoenix — Dynamic Interactive Pitch Deck</title>
  <!-- Google Fonts: A (Cormorant+Jost), B (Space Grotesk+JetBrains Mono), C (Chakra Petch) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=JetBrains+Mono:wght@300;400;600&family=Jost:wght@200;300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Base Shared Design Tokens -->
  <link rel="stylesheet" href="assets/css/base.css">
  
  <style>
    /* ═══════════════════════════════════════════════════════════════
       THEME OVERRIDES & DYNAMIC TOKENS
       ═══════════════════════════════════════════════════════════════ */
    body[data-template="a"] {
      --bg: #0a0a0b;
      --bg-card: rgba(10, 10, 12, 0.08);
      --bg-card-hover: rgba(201, 169, 110, 0.08);
      --ink: #ecebe6;
      --ink-sub: #b5b0a3;
      --accent: #c9a96e;
      --accent-glow: rgba(201, 169, 110, 0.22);
      --line: rgba(201, 169, 110, 0.28);
      --line-subtle: rgba(201, 169, 110, 0.14);
      --font-display: "Cormorant Garamond", Georgia, "Noto Sans TC", serif;
      --font-body: "Jost", "Noto Sans TC", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --tag-radius: 999px;
      --card-radius: 6px;
    }
    
    body[data-template="b"] {
      --bg: #050a14;
      --bg-card: rgba(5, 10, 20, 0.08);
      --bg-card-hover: rgba(79, 209, 197, 0.08);
      --ink: #dce7f0;
      --ink-sub: #829ab1;
      --accent: #4fd1c5;
      --accent-glow: rgba(79, 209, 197, 0.24);
      --line: rgba(79, 209, 197, 0.32);
      --line-subtle: rgba(79, 209, 197, 0.15);
      --font-display: "Space Grotesk", "Noto Sans TC", sans-serif;
      --font-body: "Space Grotesk", "Noto Sans TC", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --tag-radius: 2px;
      --card-radius: 2px;
    }
    
    body[data-template="c"] {
      --bg: #06070b;
      --bg-card: rgba(6, 7, 11, 0.08);
      --bg-card-hover: rgba(53, 224, 255, 0.08);
      --ink: #eaf6ff;
      --ink-sub: #7a8fa6;
      --accent: #35e0ff;
      --accent-glow: rgba(53, 224, 255, 0.25);
      --line: rgba(94, 214, 255, 0.3);
      --line-subtle: rgba(139, 123, 255, 0.16);
      --font-display: "Chakra Petch", "Noto Sans TC", sans-serif;
      --font-body: "Chakra Petch", "Noto Sans TC", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --tag-radius: 4px;
      --card-radius: 4px;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background 0.5s var(--ease), color 0.4s var(--ease);
      -webkit-font-smoothing: antialiased;
    }

    /* 3D WebGL Canvas Layer (-2) & 2D FX Interaction Layer (1) */
    #bg-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: -2;
    }
    #fx-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
    }
    .grain {
      position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: .055;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
    }

    /* Top Control Bar */
    .deck-topbar {
      position: relative; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px clamp(20px, 4vw, 48px);
      border-bottom: 1px solid var(--line-subtle);
      background: rgba(10, 10, 14, 0.72);
      backdrop-filter: blur(14px);
    }
    .brand-group {
      display: flex; align-items: center; gap: 14px;
    }
    .brand-title {
      font-family: var(--font-display);
      font-size: 19px; letter-spacing: 0.18em; text-transform: uppercase;
      font-weight: 400; text-decoration: none; color: var(--ink);
    }
    .brand-title em { color: var(--accent); font-style: normal; font-weight: 600; }
    .badge-deck {
      font-family: var(--font-mono);
      font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
      padding: 4px 10px; border: 1px solid var(--accent);
      color: var(--accent); border-radius: var(--tag-radius);
    }
    
    .deck-controls {
      display: flex; align-items: center; gap: 16px;
    }
    .control-group {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.04);
      padding: 4px; border-radius: 999px;
      border: 1px solid var(--line-subtle);
    }
    .btn-ctrl {
      background: transparent; border: none; color: var(--ink-sub);
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
      padding: 6px 14px; border-radius: 999px; cursor: pointer;
      transition: all 0.3s var(--ease);
    }
    .btn-ctrl:hover { color: var(--ink); }
    .btn-ctrl.active {
      background: var(--accent); color: var(--bg); font-weight: 600;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    /* Presentation Slide Stage */
    .deck-stage {
      position: relative; z-index: 10;
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: clamp(20px, 3vh, 40px) clamp(20px, 4vw, 48px);
    }
    /* ═══════════════════════════════════════════════════════════════
       PPTX-STYLE ANIMATIONS & STAGGERED OBJECT TIMELINES
       ═══════════════════════════════════════════════════════════════ */
    .slide-wrapper {
      width: 100%; max-width: 1280px; min-height: 640px;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--card-radius);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), 0 0 24px var(--accent-glow);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      display: flex; flex-direction: column; justify-content: space-between;
      padding: clamp(32px, 4vw, 56px);
      position: relative;
      overflow: hidden;
      transition: border-color 0.4s var(--ease), box-shadow 0.4s var(--ease), background 0.4s var(--ease);
    }

    /* Directional Slide Push Transition */
    .slide-stage-content {
      will-change: transform, opacity;
    }
    .slide-enter-next {
      animation: slideInRight 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .slide-enter-prev {
      animation: slideInLeft 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideInRight {
      0% { opacity: 0; transform: translate3d(36px, 0, 0) scale(0.985); }
      100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes slideInLeft {
      0% { opacity: 0; transform: translate3d(-36px, 0, 0) scale(0.985); }
      100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    /* Staggered Object Reveal Items */
    .obj-anim {
      opacity: 1;
      animation: objReveal 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .delay-1 { animation-delay: 0.04s; }
    .delay-2 { animation-delay: 0.10s; }
    .delay-3 { animation-delay: 0.16s; }
    .delay-card-0 { animation-delay: 0.22s; }
    .delay-card-1 { animation-delay: 0.28s; }
    .delay-card-2 { animation-delay: 0.34s; }
    .delay-card-3 { animation-delay: 0.40s; }

    @keyframes objReveal {
      0% { opacity: 0; transform: translate3d(0, 14px, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    /* HUD Corner Marks for Theme B/C */
    body[data-template="b"] .slide-wrapper::before,
    body[data-template="b"] .slide-wrapper::after,
    body[data-template="c"] .slide-wrapper::before,
    body[data-template="c"] .slide-wrapper::after {
      content: ""; position: absolute; width: 14px; height: 14px;
      border-color: var(--accent); border-style: solid; pointer-events: none;
    }
    body[data-template="b"] .slide-wrapper::before,
    body[data-template="c"] .slide-wrapper::before {
      top: 6px; left: 6px; border-width: 2px 0 0 2px;
    }
    body[data-template="b"] .slide-wrapper::after,
    body[data-template="c"] .slide-wrapper::after {
      bottom: 6px; right: 6px; border-width: 0 2px 2px 0;
    }

    /* Slide Header */
    .slide-meta {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .slide-tag {
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent);
      display: flex; align-items: center; gap: 8px;
    }
    .slide-tag::before {
      content: ""; display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    .slide-page-num {
      font-family: var(--font-mono); font-size: 12px; color: var(--ink-sub);
    }

    .slide-title {
      font-family: var(--font-display);
      font-size: clamp(30px, 3.6vw, 48px);
      font-weight: 400; line-height: 1.12;
      letter-spacing: -0.01em; margin-bottom: 12px;
      color: var(--ink);
    }
    .slide-desc {
      font-size: clamp(14px, 1.2vw, 16px);
      color: var(--ink-sub); line-height: 1.6; max-width: 920px;
      margin-bottom: 32px;
    }

    /* Grid Layout of Slide Cards */
    .slide-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px; margin-bottom: 28px;
    }
    .stat-card {
      background: rgba(10, 15, 25, 0.15);
      border: 1px solid var(--line-subtle);
      border-radius: var(--card-radius);
      padding: 22px;
      transition: all 0.3s var(--ease);
      display: flex; flex-direction: column; justify-content: space-between;
      position: relative;
    }
    .stat-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--line);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }
    .stat-card-label {
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--ink-sub); margin-bottom: 10px;
    }
    .stat-card-value {
      font-family: var(--font-display);
      font-size: clamp(30px, 2.8vw, 42px);
      font-weight: 500; color: var(--accent);
      line-height: 1.0; margin-bottom: 8px;
      display: flex; align-items: baseline;
    }
    .stat-card-unit {
      font-size: 13px; font-weight: 300; color: var(--ink-sub); margin-left: 6px;
      font-family: var(--font-body);
    }
    .stat-card-desc {
      font-size: 12.5px; color: var(--ink-sub); line-height: 1.5;
    }

    /* Footnote */
    .slide-footnote {
      padding-top: 18px; border-top: 1px solid var(--line-subtle);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11.5px; color: var(--ink-sub); font-family: var(--font-mono);
    }
    .ssot-indicator {
      display: flex; align-items: center; gap: 8px; color: var(--accent);
    }

    /* Deck Navigation Footer */
    .deck-footer {
      position: relative; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px clamp(20px, 4vw, 48px);
      background: rgba(10, 10, 14, 0.85);
      border-top: 1px solid var(--line-subtle);
      backdrop-filter: blur(12px);
    }
    .timeline-steps {
      display: flex; align-items: center; gap: 8px;
    }
    .step-pill {
      height: 4px; border-radius: 2px;
      background: var(--line-subtle); width: 36px;
      transition: all 0.4s var(--ease); cursor: pointer;
    }
    .step-pill.active {
      background: var(--accent); width: 64px;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .nav-actions {
      display: flex; align-items: center; gap: 12px;
    }
    .btn-nav {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.15em;
      padding: 8px 18px; border-radius: var(--tag-radius);
      cursor: pointer; transition: all 0.3s var(--ease);
    }
    .btn-nav:hover {
      background: var(--accent); color: var(--bg);
      box-shadow: 0 0 14px var(--accent-glow);
    }
  </style>
</head>
<body data-template="a">
  <!-- 3D Canvas + 2D FX Canvas + Grain Layers -->
  <canvas id="bg-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>
  <div class="grain"></div>

  <!-- Top Control Bar -->
  <header class="deck-topbar">
    <div class="brand-group">
      <a class="brand-title" href="index.html">INDO<em>·</em>PHOENIX</a>
      <div class="badge-deck" data-i18n="deckBadge">Pitch Deck Sample</div>
    </div>

    <div class="deck-controls">
      <!-- Theme Switcher (A/B/C) with full 3D and FX switching -->
      <div class="control-group">
        <button class="btn-ctrl active" onclick="switchTheme('a')">A: Obsidian (黑金)</button>
        <button class="btn-ctrl" onclick="switchTheme('b')">B: Mission Control (航太)</button>
        <button class="btn-ctrl" onclick="switchTheme('c')">C: Hologram (全息)</button>
      </div>

      <!-- Language Toggle (EN / ZH) -->
      <div class="control-group">
        <button class="btn-ctrl active" id="btn-lang-en" onclick="setLang('en')">EN</button>
        <button class="btn-ctrl" id="btn-lang-zh" onclick="setLang('zh')">繁中</button>
      </div>
    </div>
  </header>

  <!-- Presentation Stage Area -->
  <main class="deck-stage">
    <div class="slide-wrapper" id="slideContainer">
      <div id="slideContent">
        <!-- Rendered by JS -->
      </div>

      <div class="slide-footnote">
        <div class="ssot-indicator">
          <span style="font-size: 14px;">●</span>
          <span data-i18n="ssotLive">SSOT Live Connected: Google Sheet (FPC Factory Model)</span>
        </div>
        <div id="slideKeyboardHint" data-i18n="keyboardHint">Use ◄ / ► arrow keys or drag mouse to interact with 3D/FX</div>
      </div>
    </div>
  </main>

  <!-- Deck Navigation Footer -->
  <footer class="deck-footer">
    <div class="timeline-steps" id="timelineSteps"></div>
    <div class="nav-actions">
      <button class="btn-nav" onclick="prevSlide()" data-i18n="btnPrev">◄ PREV</button>
      <button class="btn-nav" onclick="nextSlide()" data-i18n="btnNext">NEXT ►</button>
    </div>
  </footer>

  <!-- Core Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/content-engine.js"></script>
  <script src="assets/js/app.js"></script>

            desc: "基礎化學品 100% 在地採購降低外匯曝險，關鍵特殊膜材台日戰略進口。工廠稼動率達 50.8%（月營收 $1.22M）即跨越損益兩平點。",
            cards: [
              { label: "滿載年度營收", val: "$28.8", unit: "M 美元", desc: "以 $160/m² 加權單價在 15,000 m²/月滿載時達成。" },
              { label: "損益兩平稼動率", val: "50.8", unit: "%", desc: "月營收達 121.8 萬美元即全面獲利，安全邊際極高。" },
              { label: "內部報酬率 (IRR)", val: "21.3 – 24.8", unit: "%", desc: "大幅超越傳統電子代工與製造業回報基準。" },
              { label: "總廠房建置規模", val: "13,000", unit: "m²", desc: "含萬級黃光無塵室 1,500m² 與廢水零排放 ZLD 設施 3,000m²。" }
            ]
          }
        ]
      }
    };

    let currentTheme = "a";
    let currentLang = "en";
    let currentSlide = 0;
    let slideDirection = "next"; // 'next' or 'prev'

    // Load URL param for theme/lang if present e.g. sample-deck.html?theme=b&lang=zh
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("theme")) currentTheme = urlParams.get("theme").toLowerCase();
    if (urlParams.get("lang")) currentLang = urlParams.get("lang").toLowerCase();

    function setLang(lang) {
      currentLang = lang;
      document.getElementById("btn-lang-en").classList.toggle("active", lang === "en");
      document.getElementById("btn-lang-zh").classList.toggle("active", lang === "zh");
      
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (I18N[lang][key]) el.textContent = I18N[lang][key];
      });

      renderSlide();
    }

    let isAnimating = false;

    function renderSlide() {
      const slides = I18N[currentLang].slides;
      const slide = slides[currentSlide];
      const container = document.getElementById("slideContent");

      const content = `
        <div class="slide-stage-content" id="activeSlideStage">
          <div class="slide-meta gs-reveal">
            <div class="slide-tag">${slide.tag}</div>
            <div class="slide-page-num">${currentSlide + 1} / ${slides.length}</div>
          </div>
          <h1 class="slide-title gs-reveal">${slide.title}</h1>
          <p class="slide-desc gs-reveal">${slide.desc}</p>
          <div class="slide-grid">
            ${slide.cards.map((c, idx) => `
              <div class="stat-card gs-card">
                <div class="stat-card-label">${c.label}</div>
                <div class="stat-card-value">
                  <span class="count-target" data-target="${c.val}">0</span>
                  <span class="stat-card-unit">${c.unit}</span>
                </div>
                <div class="stat-card-desc">${c.desc}</div>
              </div>
            `).join("")}
          </div>
        </div>
      `;

      container.innerHTML = content;
      renderTimeline();

      // Trigger 3D background pulse reaction
      triggerFxPulse();

      // Execute powerful GSAP Presentation Timelines
      if (window.gsap) {
        const xOffset = slideDirection === "next" ? 60 : -60;
        const tl = gsap.timeline({
          onComplete: () => { isAnimating = false; }
        });

        // Stage enter
        tl.fromTo("#activeSlideStage", 
          { opacity: 0, x: xOffset, scale: 0.98 },
          { opacity: 1, x: 0, scale: 1, duration: 0.45, ease: "power3.out" }
        );

        // Header / Desc reveal
        tl.fromTo(".gs-reveal",
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.4, stagger: 0.08, ease: "power2.out" },
          "-=0.3"
        );

        // Cards Staggered Pop-in
        tl.fromTo(".gs-card",
          { opacity: 0, y: 25, scale: 0.95 },
          { opacity: 1, y: 0, scale: 1, duration: 0.45, stagger: 0.08, ease: "back.out(1.4)" },
          "-=0.25"
        );

        // Digital count up sync
        animateNumbers();
      } else {
        animateNumbers();
      }
    }

    function triggerFxPulse() {
      try {
        if (currentTheme === "a" && window.IPX_SMOKE && window.IPX_SMOKE.boost) {
          window.IPX_SMOKE.boost(1.8);
          setTimeout(() => window.IPX_SMOKE.boost(0), 400);
        } else if (currentTheme === "b" && window.IPX_ORBIT && window.IPX_ORBIT.pulse) {
          window.IPX_ORBIT.pulse(window.innerWidth / 2, window.innerHeight / 2);
        } else if (currentTheme === "c" && window.IPX_HOLO && window.IPX_HOLO.warp) {
          window.IPX_HOLO.warp(1.0);
        }
      } catch (e) {}
    }

    function animateNumbers() {
      document.querySelectorAll(".count-target").forEach(el => {
        const raw = el.getAttribute("data-target");
        // Check if pure numeric
        const clean = raw.replace(/[$,%]/g, "").trim();
        const num = parseFloat(clean);
        if (isNaN(num)) return; // Keep string like "48 – 72" or "21.3 – 24.8"
        
        const prefix = raw.startsWith("$") ? "$" : "";
        const suffix = raw.endsWith("%") ? "%" : "";
        const isDecimal = clean.includes(".");
        const decimals = isDecimal ? clean.split(".")[1].length : 0;
        
        const duration = 650;
        const start = performance.now();
        const startVal = 0;

        function tick(now) {
          const t = Math.min(1, (now - start) / duration);
          const ease = 1 - Math.pow(1 - t, 3);
          const current = (startVal + (num - startVal) * ease);
          
          if (decimals > 0) {
            el.textContent = prefix + current.toFixed(decimals) + suffix;
          } else {
            el.textContent = prefix + Math.round(current).toLocaleString() + suffix;
          }

          if (t < 1) requestAnimationFrame(tick);
          else el.textContent = raw;
        }
        requestAnimationFrame(tick);
      });
    }

    function renderTimeline() {
      const slides = I18N[currentLang].slides;
      const container = document.getElementById("timelineSteps");
      container.innerHTML = slides.map((_, idx) => `
        <div class="step-pill ${idx === currentSlide ? 'active' : ''}" onclick="goToSlide(${idx})"></div>
      `).join("");
    }

    function goToSlide(idx) {
      if (idx === currentSlide) return;
      slideDirection = idx > currentSlide ? "next" : "prev";
      currentSlide = idx;
      renderSlide();
    }
    function nextSlide() {
      const slides = I18N[currentLang].slides;
      if (currentSlide < slides.length - 1) {
        slideDirection = "next";
        currentSlide++;
        renderSlide();
      }
    }
    function prevSlide() {
      if (currentSlide > 0) {
        slideDirection = "prev";
        currentSlide--;
        renderSlide();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") nextSlide();
      if (e.key === "ArrowLeft" || e.key === "PageUp") prevSlide();
    });

    /* ═══════════════════════════════════════════════════════════════
       DYNAMIC 3D & FX LOADER (Injects Scene & FX per Theme)
       ═══════════════════════════════════════════════════════════════ */
    let dynamicScripts = [];

    function switchTheme(theme) {
      if (theme !== currentTheme) {
        // Direct reload with parameter to ensure 100% clean WebGL Context recreation
        const url = new URL(window.location.href);
        url.searchParams.set("theme", theme);
        url.searchParams.set("lang", currentLang);
        window.location.href = url.toString();
        return;
      }
    }

    function loadActiveThemeScene(theme) {
      document.body.setAttribute("data-template", theme);
      
      document.querySelectorAll(".control-group .btn-ctrl").forEach(btn => {
        if (btn.textContent.toLowerCase().includes(theme + ":")) {
          btn.classList.add("active");
        } else if (btn.textContent.includes("A:") || btn.textContent.includes("B:") || btn.textContent.includes("C:")) {
          btn.classList.remove("active");
        }
      });

      const sceneScript = document.createElement("script");
      const fxScript = document.createElement("script");

      if (theme === "a") {
        sceneScript.src = "assets/js/scene-a.js";
        fxScript.src = "assets/js/fx.js";
      } else if (theme === "b") {
        sceneScript.src = "assets/js/scene-b.js";
        const fxCore = document.createElement("script");
        fxCore.src = "assets/js/fx-core.js";
        document.body.appendChild(fxCore);
        fxScript.src = "assets/js/fx-b.js";
      } else if (theme === "c") {
        sceneScript.src = "assets/js/scene-c.js";
        const fxCore = document.createElement("script");
        fxCore.src = "assets/js/fx-core.js";
        document.body.appendChild(fxCore);
        fxScript.src = "assets/js/fx-c.js";
      }

      document.body.appendChild(sceneScript);
      document.body.appendChild(fxScript);
    }

    // Init Execution on Window Load & DOM Ready
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => {
        setLang(currentLang);
        loadActiveThemeScene(currentTheme);
      });
    } else {
      setLang(currentLang);
      loadActiveThemeScene(currentTheme);
    }
  </script>
</body>
</html>
