<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Indo-Phoenix — Ultimate Investor WebPPT Experience</title>
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,300&family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Jost:wght@200;300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/base.css">
  
  <style>
    /* ═══════════════════════════════════════════════════════════════
       THEME PALETTES & ADVANCED CSS VARIABLES
       ═══════════════════════════════════════════════════════════════ */
    body[data-template="a"] {
      --bg: #09090b;
      --bg-card: rgba(16, 16, 20, 0.22);
      --bg-card-hover: rgba(201, 169, 110, 0.12);
      --ink: #ecebe6;
      --ink-sub: #a8a294;
      --accent: #c9a96e;
      --accent-glow: rgba(201, 169, 110, 0.35);
      --accent-light: #f2e2c2;
      --line: rgba(201, 169, 110, 0.32);
      --line-subtle: rgba(201, 169, 110, 0.16);
      --font-display: "Cormorant Garamond", Georgia, "Noto Sans TC", serif;
      --font-body: "Jost", "Noto Sans TC", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --tag-radius: 999px;
      --card-radius: 8px;
    }
    
    body[data-template="b"] {
      --bg: #040813;
      --bg-card: rgba(6, 16, 32, 0.25);
      --bg-card-hover: rgba(79, 209, 197, 0.14);
      --ink: #dce7f0;
      --ink-sub: #829ab1;
      --accent: #4fd1c5;
      --accent-glow: rgba(79, 209, 197, 0.38);
      --accent-light: #a7f3d0;
      --line: rgba(79, 209, 197, 0.35);
      --line-subtle: rgba(79, 209, 197, 0.16);
      --font-display: "Space Grotesk", "Noto Sans TC", sans-serif;
      --font-body: "Space Grotesk", "Noto Sans TC", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --tag-radius: 3px;
      --card-radius: 3px;
    }
    
    body[data-template="c"] {
      --bg: #06070c;
      --bg-card: rgba(10, 13, 24, 0.25);
      --bg-card-hover: rgba(53, 224, 255, 0.14);
      --ink: #eaf6ff;
      --ink-sub: #7a8fa6;
      --accent: #35e0ff;
      --accent-glow: rgba(53, 224, 255, 0.4);
      --accent-light: #c084fc;
      --line: rgba(94, 214, 255, 0.32);
      --line-subtle: rgba(139, 123, 255, 0.2);
      --font-display: "Chakra Petch", "Noto Sans TC", sans-serif;
      --font-body: "Chakra Petch", "Noto Sans TC", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --tag-radius: 4px;
      --card-radius: 4px;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      perspective: 1200px;
      -webkit-font-smoothing: antialiased;
      transition: background 0.6s var(--ease);
    }

    #bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -2; }
    #fx-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
    .grain {
      position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: .055;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
    }

    /* ═══════════════════════════════════════════════════════════════
       TOP CONTROL BAR (PREMIUM COCKPIT)
       ═══════════════════════════════════════════════════════════════ */
    .deck-topbar {
      position: relative; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px clamp(20px, 4vw, 56px);
      border-bottom: 1px solid var(--line-subtle);
      background: rgba(8, 9, 13, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .brand-group { display: flex; align-items: center; gap: 14px; }
    .brand-title {
      font-family: var(--font-display);
      font-size: 19px; letter-spacing: 0.18em; text-transform: uppercase;
      font-weight: 400; text-decoration: none; color: var(--ink);
    }
    .brand-title em { color: var(--accent); font-style: normal; font-weight: 600; }
    .badge-deck {
      font-family: var(--font-mono);
      font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
      padding: 3px 9px; border: 1px solid var(--accent);
      color: var(--accent); border-radius: var(--tag-radius);
    }
    
    .deck-controls { display: flex; align-items: center; gap: 14px; }
    .control-group {
      display: flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.03);
      padding: 3px; border-radius: 999px;
      border: 1px solid var(--line-subtle);
    }
    .btn-ctrl {
      background: transparent; border: none; color: var(--ink-sub);
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
      padding: 5px 12px; border-radius: 999px; cursor: pointer;
      transition: all 0.3s var(--ease);
    }
    .btn-ctrl:hover { color: var(--ink); }
    .btn-ctrl.active {
      background: var(--accent); color: var(--bg); font-weight: 600;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    /* ═══════════════════════════════════════════════════════════════
       STAGE & 3D HOLOGRAPHIC STAGE CONTAINER
       ═══════════════════════════════════════════════════════════════ */
    .deck-stage {
      position: relative; z-index: 10;
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: clamp(20px, 3vh, 48px) clamp(20px, 4vw, 56px);
      perspective: 1600px;
    }
    .slide-wrapper {
      width: 100%; max-width: 1320px; min-height: 660px;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--card-radius);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45), 0 0 36px var(--accent-glow);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex; flex-direction: column; justify-content: space-between;
      padding: clamp(32px, 4vw, 56px);
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: border-color 0.4s var(--ease), box-shadow 0.4s var(--ease);
    }

    /* Corner Sci-Fi Tech Notches */
    body[data-template="b"] .slide-wrapper::before,
    body[data-template="b"] .slide-wrapper::after,
    body[data-template="c"] .slide-wrapper::before,
    body[data-template="c"] .slide-wrapper::after {
      content: ""; position: absolute; width: 16px; height: 16px;
      border-color: var(--accent); border-style: solid; pointer-events: none;
    }
    body[data-template="b"] .slide-wrapper::before,
    body[data-template="c"] .slide-wrapper::before {
      top: 8px; left: 8px; border-width: 2px 0 0 2px;
    }
    body[data-template="b"] .slide-wrapper::after,
    body[data-template="c"] .slide-wrapper::after {
      bottom: 8px; right: 8px; border-width: 0 2px 2px 0;
    }

    /* Laser Scanner Beam sweep across stage during slide transition */
    .scan-beam {
      position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
      pointer-events: none; z-index: 50; opacity: 0;
      transform: skewX(-25deg);
    }

    /* Slide Meta Header */
    .slide-meta {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .slide-tag {
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent);
      display: flex; align-items: center; gap: 8px;
    }
    .slide-tag::before {
      content: ""; display: inline-block; width: 7px; height: 7px;
      border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulseDot 2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 14px var(--accent); }
    }
    .slide-page-num {
      font-family: var(--font-mono); font-size: 12px; color: var(--ink-sub);
      background: rgba(255,255,255,0.03); padding: 4px 10px;
      border-radius: var(--tag-radius); border: 1px solid var(--line-subtle);
    }

    .slide-title {
      font-family: var(--font-display);
      font-size: clamp(32px, 3.8vw, 52px);
      font-weight: 400; line-height: 1.1;
      letter-spacing: -0.01em; margin-bottom: 12px;
      color: var(--ink);
    }
    .slide-desc {
      font-size: clamp(14px, 1.2vw, 16.5px);
      color: var(--ink-sub); line-height: 1.6; max-width: 960px;
      margin-bottom: 32px;
    }

    /* ═══════════════════════════════════════════════════════════════
       SLIDE 1: HERO METRICS SHOWCASE
       ═══════════════════════════════════════════════════════════════ */
    .hero-metric-box {
      display: grid; grid-template-columns: 1.2fr 2fr; gap: 24px;
      align-items: stretch; margin-bottom: 28px;
    }
    .main-anchor-stat {
      background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(0,0,0,0.4) 100%);
      border: 1px solid var(--accent);
      border-radius: var(--card-radius);
      padding: 32px 28px;
      display: flex; flex-direction: column; justify-content: center;
      box-shadow: 0 12px 36px var(--accent-glow);
      position: relative; overflow: hidden;
    }
    .main-anchor-stat::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at top right, var(--accent-glow), transparent 70%);
      pointer-events: none;
    }
    .main-stat-label {
      font-family: var(--font-mono); font-size: 12px;
      letter-spacing: 0.25em; text-transform: uppercase; color: var(--ink-sub);
      margin-bottom: 12px;
    }
    .main-stat-num {
      font-family: var(--font-display); font-size: clamp(48px, 4.8vw, 76px);
      color: var(--accent); font-weight: 600; line-height: 1; margin-bottom: 12px;
    }
    .main-stat-desc { font-size: 13.5px; color: var(--ink-sub); line-height: 1.5; }

    .sub-stat-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }

    /* ═══════════════════════════════════════════════════════════════
       SLIDE 2: COMPARISON & TIMELINE MATRIX (PAIN VS ADVANTAGE)
       ═══════════════════════════════════════════════════════════════ */
    .vs-matrix {
      display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 28px;
    }
    .vs-col {
      border-radius: var(--card-radius); padding: 26px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--line-subtle);
      transition: all 0.3s var(--ease);
    }
    .vs-col.bad { border-left: 4px solid #ef4444; }
    .vs-col.good {
      border-left: 4px solid var(--accent);
      background: linear-gradient(135deg, rgba(79, 209, 197, 0.05) 0%, rgba(0,0,0,0.3) 100%);
      box-shadow: 0 8px 32px var(--accent-glow);
    }
    .vs-header {
      font-family: var(--font-mono); font-size: 13px; font-weight: 600;
      letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 18px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .vs-list { list-style: none; display: flex; flex-direction: column; gap: 14px; }
    .vs-item {
      display: flex; align-items: flex-start; gap: 12px;
      font-size: 13.5px; line-height: 1.5; color: var(--ink-sub);
    }
    .vs-item strong { color: var(--ink); font-weight: 500; }
    .vs-badge {
      font-family: var(--font-mono); font-size: 11px; padding: 2px 8px;
      border-radius: var(--tag-radius); flex-shrink: 0; font-weight: 600;
    }
    .badge-bad { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .badge-good { background: var(--accent-glow); color: var(--accent); border: 1px solid var(--accent); }

    /* ═══════════════════════════════════════════════════════════════
       SLIDE 3: INTERACTIVE PIPELINE FLOW (SMART FACTORY AI/ACC)
       ═══════════════════════════════════════════════════════════════ */
    .flow-pipeline {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
      margin-bottom: 28px; position: relative;
    }
    .flow-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--line-subtle);
      border-radius: var(--card-radius); padding: 22px 18px;
      position: relative; transition: all 0.3s var(--ease);
    }
    .flow-card:hover {
      background: var(--bg-card-hover); border-color: var(--accent);
      transform: translateY(-4px); box-shadow: 0 10px 30px var(--accent-glow);
    }
    .flow-step-num {
      font-family: var(--font-mono); font-size: 26px; font-weight: 700;
      color: var(--accent); line-height: 1; margin-bottom: 12px;
      opacity: 0.8;
    }
    .flow-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; color: var(--ink); }
    .flow-desc { font-size: 12.5px; color: var(--ink-sub); line-height: 1.5; }

    /* ═══════════════════════════════════════════════════════════════
       SLIDE 4: DYNAMIC FINANCIAL BARS & CAPEX DEDUCTION
       ═══════════════════════════════════════════════════════════════ */
    .capex-waterfall {
      display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px;
    }
    .waterfall-bar-group { display: flex; flex-direction: column; gap: 6px; }
    .bar-meta {
      display: flex; justify-content: space-between; font-family: var(--font-mono);
      font-size: 12px; color: var(--ink-sub);
    }
    .bar-meta strong { color: var(--ink); }
    .bar-track {
      width: 100%; height: 16px; background: rgba(255,255,255,0.04);
      border-radius: 999px; overflow: hidden; border: 1px solid var(--line-subtle);
      position: relative;
    }
    .bar-fill {
      height: 100%; border-radius: 999px; width: 0%;
      background: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
      transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .bar-fill.subsidy {
      background: linear-gradient(90deg, #10b981, #34d399);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.4);
    }
    .bar-fill.net {
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
    }

    /* ═══════════════════════════════════════════════════════════════
       SLIDE 5: DYNAMIC BEP METER GAUGE & SENSITIVITY SLIDER
       ═══════════════════════════════════════════════════════════════ */
    .bep-cockpit {
      display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: center;
      margin-bottom: 28px;
    }
    .gauge-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.02); border: 1px solid var(--line-subtle);
      border-radius: var(--card-radius); padding: 28px;
    }
    .gauge-circle {
      position: relative; width: 180px; height: 90px; overflow: hidden;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .gauge-arc {
      width: 180px; height: 180px; border-radius: 50%;
      border: 14px solid rgba(255,255,255,0.05);
      border-top-color: var(--accent); border-left-color: var(--accent);
      position: absolute; top: 0; left: 0;
      transform: rotate(-45deg);
      box-shadow: 0 0 24px var(--accent-glow);
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .gauge-value {
      font-family: var(--font-display); font-size: 38px; font-weight: 600;
      color: var(--accent); line-height: 1; z-index: 2; margin-bottom: 4px;
    }
    .gauge-label {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--ink-sub); margin-top: 14px;
    }

    /* Generic Card fallback */
    .stat-card {
      background: rgba(10, 15, 25, 0.18);
      border: 1px solid var(--line-subtle);
      border-radius: var(--card-radius);
      padding: 22px; transition: all 0.3s var(--ease);
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .stat-card:hover {
      background: var(--bg-card-hover); border-color: var(--accent);
      transform: translateY(-3px); box-shadow: 0 8px 24px var(--accent-glow);
    }
    .stat-card-label {
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-sub);
      margin-bottom: 10px;
    }
    .stat-card-value {
      font-family: var(--font-display); font-size: clamp(30px, 2.8vw, 42px);
      font-weight: 500; color: var(--accent); line-height: 1.0; margin-bottom: 8px;
      display: flex; align-items: baseline;
    }
    .stat-card-unit {
      font-size: 13px; font-weight: 300; color: var(--ink-sub); margin-left: 6px;
      font-family: var(--font-body);
    }
    .stat-card-desc { font-size: 12.5px; color: var(--ink-sub); line-height: 1.5; }

    /* Footnote */
    .slide-footnote {
      padding-top: 18px; border-top: 1px solid var(--line-subtle);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11.5px; color: var(--ink-sub); font-family: var(--font-mono);
    }
    .ssot-indicator { display: flex; align-items: center; gap: 8px; color: var(--accent); }

    /* ═══════════════════════════════════════════════════════════════
       DECK NAVIGATION FOOTER
       ═══════════════════════════════════════════════════════════════ */
    .deck-footer {
      position: relative; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px clamp(20px, 4vw, 56px);
      background: rgba(8, 9, 13, 0.85);
      border-top: 1px solid var(--line-subtle);
      backdrop-filter: blur(12px);
    }
    .timeline-steps { display: flex; align-items: center; gap: 8px; }
    .step-pill {
      height: 4px; border-radius: 2px;
      background: var(--line-subtle); width: 32px;
      transition: all 0.4s var(--ease); cursor: pointer;
    }
    .step-pill.active {
      background: var(--accent); width: 64px;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .btn-nav {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.15em;
      padding: 8px 18px; border-radius: var(--tag-radius);
      cursor: pointer; transition: all 0.3s var(--ease);
    }
    .btn-nav:hover {
      background: var(--accent); color: var(--bg);
      box-shadow: 0 0 16px var(--accent-glow);
    }
  </style>
</head>
<body data-template="a">
  <canvas id="bg-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>
  <div class="grain"></div>

  <!-- Top Control Bar -->
  <header class="deck-topbar">
    <div class="brand-group">
      <a class="brand-title" href="index.html">INDO<em>·</em>PHOENIX</a>
      <div class="badge-deck" data-i18n="deckBadge">Investor Pitch Deck</div>
    </div>

    <div class="deck-controls">
      <!-- 3D Theme Switcher -->
      <div class="control-group">
        <button class="btn-ctrl active" onclick="switchTheme('a')">A: Obsidian (黑金)</button>
        <button class="btn-ctrl" onclick="switchTheme('b')">B: Mission Control (航太)</button>
        <button class="btn-ctrl" onclick="switchTheme('c')">C: Hologram (全息)</button>
      </div>

      <!-- Bilingual Language Toggle -->
      <div class="control-group">
        <button class="btn-ctrl active" id="btn-lang-en" onclick="setLang('en')">EN</button>
        <button class="btn-ctrl" id="btn-lang-zh" onclick="setLang('zh')">繁中</button>
      </div>
    </div>
  </header>

  <!-- Presentation Stage Area -->
  <main class="deck-stage">
    <div class="slide-wrapper" id="slideWrapper">
      <div class="scan-beam" id="scanBeam"></div>
      
      <!-- Dynamic Slide Content Area (Different structure per slide) -->
      <div id="slideContent">
        <!-- Rendered by JS -->
      </div>

      <div class="slide-footnote">
        <div class="ssot-indicator">
          <span style="font-size: 14px;">●</span>
          <span data-i18n="ssotLive">SSOT Live Connected: Google Sheet (FPC Factory Model)</span>
        </div>
        <div id="slideKeyboardHint" data-i18n="keyboardHint">Use ◄ / ► arrow keys or click pills to trigger 3D cinematic transitions</div>
      </div>
    </div>
  </main>

  <!-- Deck Navigation Footer -->
  <footer class="deck-footer">
    <div class="timeline-steps" id="timelineSteps"></div>
    <div class="nav-actions">
      <button class="btn-nav" onclick="prevSlide()" data-i18n="btnPrev">◄ PREV</button>
      <button class="btn-nav" onclick="nextSlide()" data-i18n="btnNext">NEXT ►</button>
    </div>
  </footer>

  <!-- Core Animation & 3D Engines -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    let currentTheme = "a";

    function setLang(lang) {

      document.getElementById("btn-lang-zh").classList.toggle("active", lang === "zh");

       ═══════════════════════════════════════════════════════════════ */
    function renderSlide(animate = true) {

      const slide = slides[currentSlide];
      const container = document.getElementById("slideContent");

              <ul class="vs-list">
                ${slide.goodList.map(item => `
                  <li class="vs-item">
                    <span class="vs-badge badge-good">${item.badge}</span>

                `).join("")}

              <div class="waterfall-bar-group gs-anim-bar">

      else if (slide.type === "bep-cockpit") {

            <div class="sub-stat-grid">
              ${slide.cards.map(c => `

    /* ═══════════════════════════════════════════════════════════════
       CINEMATIC 3D GSAP TRANSITION TIMELINE
       ═══════════════════════════════════════════════════════════════ */
    function executeCinematicTimeline() {
      isTransitioning = true;
      const rotY = slideDirection === "next" ? 18 : -18;
      const transX = slideDirection === "next" ? 80 : -80;

      // 1. Sweep Laser Beam
      gsap.fromTo("#scanBeam", 
        { left: "-100%", opacity: 0.8 },
        { left: "140%", opacity: 0, duration: 0.7, ease: "power2.out" }
      );

      // 2. 3D Stage Origami Pivot
      gsap.fromTo("#slideWrapper",
        { rotateY: rotY, scale: 0.94, filter: "brightness(1.4)" },
        { rotateY: 0, scale: 1, filter: "brightness(1)", duration: 0.65, ease: "power3.out" }
      );

      // 3. Elements Timeline
      const tl = gsap.timeline({
        onComplete: () => {
          isTransitioning = false;
        }
      });

      tl.fromTo(".gs-anim-title",
        { opacity: 0, x: transX, filter: "blur(8px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }
      );

      tl.fromTo(".gs-anim-desc",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        "-=0.3"
      );

      // Unique slide animation hooks
      if (document.querySelector(".gs-anim-hero")) {
        tl.fromTo(".gs-anim-hero",
          { opacity: 0, scale: 0.9, y: 30 },
          { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.5)" },
          "-=0.25"
        );
      }
      if (document.querySelectorAll(".gs-anim-card").length) {
        tl.fromTo(".gs-anim-card",
          { opacity: 0, y: 28, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.45, stagger: 0.07, ease: "back.out(1.3)" },
          "-=0.3"
        );
      }
      if (document.querySelector(".gs-anim-left")) {
        tl.fromTo(".gs-anim-left",
          { opacity: 0, x: -50 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
          "-=0.3"
        );
        tl.fromTo(".gs-anim-right",
          { opacity: 0, x: 50 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
          "-=0.4"
        );
      }
      if (document.querySelectorAll(".gs-anim-flow").length) {
        tl.fromTo(".gs-anim-flow",
          { opacity: 0, y: 35, rotateX: 25 },
          { opacity: 1, y: 0, rotateX: 0, duration: 0.5, stagger: 0.08, ease: "back.out(1.4)" },
          "-=0.3"
        );
      }
      if (document.querySelectorAll(".gs-anim-bar").length) {
        tl.fromTo(".gs-anim-bar",
          { opacity: 0, x: -30 },
          { opacity: 1, x: 0, duration: 0.4, stagger: 0.06, ease: "power2.out" },
          "-=0.25"
        );
      }
      if (document.querySelector(".gs-anim-gauge")) {
        tl.fromTo(".gs-anim-gauge",
          { opacity: 0, scale: 0.85 },
          { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" },
          "-=0.3"
        );
      }

      // Trigger 3D/FX Ambient Reactions
      triggerFxPulse();
      animateNumbers();
      animateBars();
    }

    function triggerFxPulse() {
      try {
        if (currentTheme === "a" && window.IPX_SMOKE && window.IPX_SMOKE.boost) {
          window.IPX_SMOKE.boost(2.4);
          setTimeout(() => window.IPX_SMOKE.boost(0), 450);
        } else if (currentTheme === "b" && window.IPX_ORBIT && window.IPX_ORBIT.pulse) {
          window.IPX_ORBIT.pulse(window.innerWidth / 2, window.innerHeight / 2);
        } else if (currentTheme === "c" && window.IPX_HOLO && window.IPX_HOLO.warp) {
          window.IPX_HOLO.warp(1.5);
        }
      } catch (e) {}
    }

    function animateBars() {
      setTimeout(() => {
        document.querySelectorAll(".bar-fill").forEach(bar => {
          const pct = bar.getAttribute("data-pct");
          bar.style.width = pct + "%";
        });
      }, 150);
    }

    function animateNumbers() {
      document.querySelectorAll(".count-target").forEach(el => {
        const raw = el.getAttribute("data-target");
        if (!raw) return;
        const clean = raw.replace(/[$,%M]/g, "").trim();
        const num = parseFloat(clean);
        if (isNaN(num)) {
          el.textContent = raw;
          return;
        }

        const prefix = raw.startsWith("$") ? "$" : "";
        const suffix = raw.includes("%") ? "%" : (raw.includes("M") ? "M" : (raw.includes("年") ? " 年" : (raw.includes("Yrs") ? " Yrs" : "")));
        const isDecimal = clean.includes(".");
        const decimals = isDecimal ? clean.split(".")[1].length : 0;
        
        const duration = 750;
        const start = performance.now();

        function tick(now) {
          const t = Math.min(1, (now - start) / duration);
          const ease = 1 - Math.pow(1 - t, 4);
          const current = num * ease;
          
          if (decimals > 0) {
            el.textContent = prefix + current.toFixed(decimals) + suffix;
          } else {
            el.textContent = prefix + Math.round(current).toLocaleString() + suffix;
          }

          if (t < 1) requestAnimationFrame(tick);
          else el.textContent = raw;
        }
        requestAnimationFrame(tick);
      });
    }

    function renderTimeline() {
      const slides = I18N[currentLang].slides;
      const container = document.getElementById("timelineSteps");
      container.innerHTML = slides.map((_, idx) => `
        <div class="step-pill ${idx === currentSlide ? 'active' : ''}" onclick="goToSlide(${idx})"></div>
      `).join("");
    }

    function goToSlide(idx) {
      if (idx === currentSlide || isTransitioning) return;
      slideDirection = idx > currentSlide ? "next" : "prev";
      currentSlide = idx;
      renderSlide(true);
    }
    function nextSlide() {
      const slides = I18N[currentLang].slides;
      if (currentSlide < slides.length - 1 && !isTransitioning) {
        slideDirection = "next";
        currentSlide++;
        renderSlide(true);
      }
    }
    function prevSlide() {
      if (currentSlide > 0 && !isTransitioning) {
        slideDirection = "prev";
        currentSlide--;
        renderSlide(true);
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") nextSlide();
      if (e.key === "ArrowLeft" || e.key === "PageUp") prevSlide();
    });

    function switchTheme(theme) {
      if (theme !== currentTheme) {
        const url = new URL(window.location.href);
        url.searchParams.set("theme", theme);
        url.searchParams.set("lang", currentLang);
        window.location.href = url.toString();
      }
    }

    function loadActiveThemeScene(theme) {
      document.body.setAttribute("data-template", theme);
      
      document.querySelectorAll(".control-group .btn-ctrl").forEach(btn => {
        if (btn.textContent.toLowerCase().includes(theme + ":")) {
          btn.classList.add("active");
        } else if (btn.textContent.includes("A:") || btn.textContent.includes("B:") || btn.textContent.includes("C:")) {
          btn.classList.remove("active");
        }
      });

      const sceneScript = document.createElement("script");
      const fxScript = document.createElement("script");

      if (theme === "a") {
        sceneScript.src = "assets/js/scene-a.js";
        fxScript.src = "assets/js/fx.js";
      } else if (theme === "b") {
        sceneScript.src = "assets/js/scene-b.js";
        const fxCore = document.createElement("script");
        fxCore.src = "assets/js/fx-core.js";
        document.body.appendChild(fxCore);
        fxScript.src = "assets/js/fx-b.js";
      } else if (theme === "c") {
        sceneScript.src = "assets/js/scene-c.js";
        const fxCore = document.createElement("script");
        fxCore.src = "assets/js/fx-core.js";
        document.body.appendChild(fxCore);
        fxScript.src = "assets/js/fx-c.js";
      }

      document.body.appendChild(sceneScript);
      document.body.appendChild(fxScript);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => {
        setLang(currentLang);
        loadActiveThemeScene(currentTheme);
      });
    } else {
      setLang(currentLang);
      loadActiveThemeScene(currentTheme);
    }
  </script>
</body>
</html>
